# Slack app manifest (BUILD_SPEC: App manifest). Create the app "From a manifest",
# then generate an app-level token with connections:write and install to the workspace.
# Keys verified against https://docs.slack.dev/reference/app-manifest (2026-11-15).
display_information:
  name: Faultline
  description: Incident triage with human approval
features:
  bot_user:
    display_name: Faultline
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
