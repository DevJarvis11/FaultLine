# PostgreSQL with pgvector for Faultline (Session 5). Plain manifest: the pgvector project
# publishes only the container image, no Helm chart.
# Image: pgvector/pgvector:0.8.7-pg17-trixie (pgvector 0.8.7, PostgreSQL 17, Debian trixie),
# pinned by digest; source: Docker Hub registry API, hub.docker.com/r/pgvector/pgvector/tags.
# Passwords are generated by deploy/lab/install-data.sh and live only in Secrets:
#   postgres-superuser (password), faultline-db (username, password), mlflow-db (username, password)
# Apply through install-data.sh, which creates the Secrets first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: faultline
data:
  # Runs once, on an empty data directory (docker-entrypoint-initdb.d). Passwords come from
  # the container environment via psql's \getenv, never from this file.
  10-roles.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    \getenv fl_pw FAULTLINE_DB_PASSWORD
    \getenv ml_pw MLFLOW_DB_PASSWORD
    CREATE ROLE faultline LOGIN PASSWORD :'fl_pw';
    CREATE ROLE mlflow LOGIN PASSWORD :'ml_pw';
    REVOKE CONNECT, TEMPORARY ON DATABASE postgres FROM PUBLIC;
    -- faultline: owned by the superuser; the app user may connect and create/use its own
    -- tables in schema public (it owns what migrate creates), nothing else.
    CREATE DATABASE faultline;
    REVOKE ALL ON DATABASE faultline FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE faultline TO faultline;
    -- mlflow: its own database, owned by the mlflow user.
    CREATE DATABASE mlflow OWNER mlflow;
    REVOKE ALL ON DATABASE mlflow FROM PUBLIC;
    \connect faultline
    -- Pre-created by the superuser; 001_core.sql's CREATE EXTENSION IF NOT EXISTS is then a no-op.
    CREATE EXTENSION IF NOT EXISTS vector;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO faultline;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: faultline
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: faultline
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:89947206f52eac3a9df9b663df7e76987cbdc623be6576b3a524953d568700d7
          args:
            # Small-footprint settings for the 10 GB lab.
            - -c
            - shared_buffers=32MB
            - -c
            - effective_cache_size=192MB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - max_connections=40
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-superuser, key: password}
            - name: FAULTLINE_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: faultline-db, key: password}
            - name: MLFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: mlflow-db, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
