[project]
name = "faultline"
version = "0.1.0"
description = "Incident triage and remediation agent for the Faultline lab"
readme = "README.md"
authors = [
    { name = "Ankith M", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "kubernetes>=37.0.2",
    "langchain-core>=1.8.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=1.30.0",
    "mlflow>=3.18.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pygithub>=2.10.0",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.30.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
faultline = "faultline.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
