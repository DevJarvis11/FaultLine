name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.0"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: "1.22.4"
      - run: opa test policies/ -v
